# The bootstrap build (roadmap item 33) has independent work in different projects — the frontend
# build, the backend's installDist and the root's downloads — so let Gradle run it concurrently
# (roadmap item 51: `./gradlew e2e`/`run` spent the frontend and backend builds back to back).
# This file is the root build's only; the standalone backend build (backend/) never reads it.
org.gradle.parallel=true
