# The failed specs' traces (roadmap item 82): Playwright's `retain-on-failure` writes a failing
# spec's trace, screenshot and error-context.md to e2e/test-results, and this attaches them to the
# run, so a red job is diagnosable without the console log. The calling step carries
# `if: failure()` — a composite action cannot — so a green run keeps nothing.
name: Upload test results
description: Attach e2e/test-results to the run under the given name, kept 7 days

inputs:
  name:
    description: The artifact's name, one per job
    required: true

runs:
  using: composite
  steps:
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.name }}
        path: e2e/test-results/
        retention-days: 7
