# The Nix setup every Nix job needs (roadmap item 51): install Nix and restore the GitHub Actions store cache.
# Only the job that runs `nix build` may save it: that job materializes the expensive whisper-cpp output.
# Nix caches are immutable per key, so letting the parallel flake-check job save first would lock in a
# small, evaluation-only store that the build job could never replace. The v2 namespace avoids that old
# undersized key; the prefix still restores it once while the new full-store cache is being populated.
name: Nix toolchain
description: Install Nix and restore (optionally save) the GitHub Actions Nix store cache

inputs:
  save-cache:
    description: Allow this job to save the Nix store cache (only the nix-build job should)
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@v31
    # No `hashFiles` here: .github/actions/pins-hash computes the sha256 over the pins plus the lock,
    # devenv and nix files (roadmap item 97: one script for both toolchains).
    - name: Compute the Nix store cache key
      id: nix-cache-key
      uses: ./.github/actions/pins-hash
      with:
        nix: 'true'
    - uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-${{ runner.os }}-v2-${{ steps.nix-cache-key.outputs.hash }}
        save: ${{ inputs.save-cache }}
        # Read the prior namespace once, but write only to v2. This avoids an existing small key
        # from blocking replacement by the completed `nix build` store.
        restore-prefixes-first-match: nix-${{ runner.os }}-
        # 4 GB, not 6: a key change transiently leaves the previous store entry alive next to the
        # Gradle, pnpm and downloads caches, and evicting those is what costs a cold run its models.
        gc-max-store-size-linux: 4G
        gc-max-store-size-macos: 4G
