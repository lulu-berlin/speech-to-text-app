# Continuous verification (roadmap item 51). Linux, macOS and Windows run on pushes to main and on
# pull requests; the pinned tool versions come from the committed versions.json (the flake's pins,
# item 33) through the shared toolchain actions in .github/actions/. No secrets.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    # A dispatch is how a branch runs the checks before a PR exists; the manual asset jobs (the
    # whisper-cli and audio-only ffmpeg assets, macOS and Windows) are opt-in, so a check-only
    # dispatch does not rebuild them (roadmap items 49 and 69).
    inputs:
      assets:
        description: 'Also build the manual macOS/Windows whisper-cli and ffmpeg assets'
        type: boolean
        default: false
  # Nightly at 03:00 Europe/Berlin (roadmap item 51, discovered): `timezone` is per cron entry.
  # The nightly runs the whole tree, including the macOS and Windows legs. GitHub runs a scheduled
  # workflow only from the default branch.
  schedule:
    - cron: '0 3 * * *'
      timezone: 'Europe/Berlin'
    # Weekly (Mondays) at 04:00 Europe/Berlin: the model-host smoke job below is gated on this cron
    # string, so the rest of the scheduled work stays nightly (ADR 0055).
    - cron: '0 4 * * 1'
      timezone: 'Europe/Berlin'

permissions:
  contents: read

# A newer commit on a PR supersedes the older run; every main commit keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-check:
    name: Backend (gradle check)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/jvm-toolchain
      # The root wrapper pins Gradle 9.8.0; -p backend runs the standalone backend build,
      # the same build the devenv's `cd backend && gradle check` runs.
      - name: gradle check
        run: ./gradlew -p backend check

  frontend-check:
    name: Frontend (pnpm test, pnpm build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-toolchain
        with:
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: pnpm test
        run: pnpm test
      - name: pnpm build
        run: pnpm build

  docs-check:
    name: Docs (exception policy)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-toolchain
        with:
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: node docs/check-exceptions.ts
        run: node docs/check-exceptions.ts
      - name: node --test docs/check-exceptions.test.ts
        run: node --test docs/check-exceptions.test.ts

  backend-integration:
    name: Backend (gradle integrationTest)
    runs-on: ubuntu-24.04
    needs: [backend-check, frontend-check]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # The Integration-tagged tests run the real binaries and models. The root task fetches them
      # (sha256-verified from versions.json) into $GRADLE_USER_HOME/stt-app, which the downloads
      # cache reuses on later runs. `setsid` (the process-tree kill, ADR 0020) ships with
      # ubuntu-24.04.
      - uses: ./.github/actions/jvm-toolchain
        with:
          downloads-cache: 'true'
          system-libs: 'true'
      - name: gradle integrationTest
        run: ./gradlew integrationTest

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-24.04
    needs: [backend-check, frontend-check]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/jvm-toolchain
        with:
          downloads-cache: 'true'
          system-libs: 'true'
      # Chromium's system libraries and the e2e package come from the build's own task, which is what
      # the invoke-it-as-root check exists for: it installs `playwright install-deps chromium` when it
      # runs as root and installs the package with the Gradle-managed pnpm, so the pnpm and Playwright
      # versions and the Chromium package list stay in e2e/package.json, versions.json and the task
      # instead of being repeated here. The chown hands back what root wrote: the Gradle home,
      # e2e/node_modules and the project directories.
      - name: Install Chromium's system libraries and the e2e package
        run: |
          set -euo pipefail
          gradle_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          sudo env HOME="$HOME" PATH="$PATH" JAVA_HOME="$JAVA_HOME" GRADLE_USER_HOME="$gradle_home" \
            ./gradlew e2eSystemDeps --no-daemon
          sudo chown -R "$(id -u):$(id -g)" "$gradle_home" "$GITHUB_WORKSPACE"
      - name: gradle e2e
        run: ./gradlew e2e

  # macOS (roadmap item 48): Apple Silicon only — Apple and nixpkgs dropped Intel Macs. These jobs
  # run on every push to main, every pull request, workflow dispatch and the nightly schedule.
  # The Gradle tree is the human path (./gradlew); the Nix job is the flake/devenv verification.
  macos-backend-check:
    name: macOS (gradle check)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/jvm-toolchain
      - name: gradle check
        run: ./gradlew -p backend check

  macos-frontend-check:
    name: macOS (pnpm test, pnpm build)
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-toolchain
        with:
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: pnpm test
        run: pnpm test
      - name: pnpm build
        run: pnpm build

  macos-backend-integration:
    name: macOS (gradle integrationTest)
    needs: [macos-backend-check, macos-frontend-check]
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/jvm-toolchain
        with:
          downloads-cache: 'true'
      - name: gradle integrationTest
        run: ./gradlew integrationTest

  macos-e2e:
    name: macOS (e2e)
    needs: [macos-backend-check, macos-frontend-check]
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/jvm-toolchain
        with:
          downloads-cache: 'true'
      - name: gradle e2e
        run: |
          rm -f e2e/.e2e-backend.log
          ./gradlew e2e
      - name: Assert a task ran through Metal
        run: |
          set -euo pipefail
          grep -q 'using MTL0 backend' e2e/.e2e-backend.log || {
            echo 'no whisper-cli MTL0 backend line in the app log' >&2
            tail -100 e2e/.e2e-backend.log
            exit 1
          }

  macos-nix:
    name: macOS (Nix build + devenv)
    needs: [macos-backend-check, macos-frontend-check]
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix-toolchain
        with:
          save-cache: 'true'
      - name: Install the devenv CLI
        run: nix profile install nixpkgs#devenv
      - name: actionlint the workflows
        run: devenv shell -- actionlint .github/workflows/*.yml
      - name: devenv test
        run: devenv test
      # Roadmap item 69 (test-list item 3): the shell's ffmpeg is the flake's ffmpeg, and that is
      # not the source build — with no pin the source is what both resolve to, so this fails until
      # nix/desktop-artifacts.nix records the darwin asset.
      - name: The shell's ffmpeg is the pinned artifact
        run: |
          set -euo pipefail
          shipped=$(nix eval --impure --raw --expr "let f = builtins.getFlake (toString ./.); pkgs = f.inputs.nixpkgs.legacyPackages.\${builtins.currentSystem}; in (import ./nix/ffmpeg.nix {inherit pkgs;}).ffmpeg.outPath")
          source=$(nix eval --impure --raw --expr "let f = builtins.getFlake (toString ./.); pkgs = f.inputs.nixpkgs.legacyPackages.\${builtins.currentSystem}; in (import ./nix/ffmpeg.nix {inherit pkgs;}).source.outPath")
          shell=$(devenv shell -- bash -c "readlink -f \"\$(command -v ffmpeg)\"")
          test "$shell" = "$shipped/bin/ffmpeg"
          test "$shipped" != "$source"
      - name: nix flake check
        run: nix flake check --print-build-logs
      - name: nix build
        run: nix build --print-build-logs

  # macOS desktop artifact (roadmap item 48): electron-builder builds the unsigned Apple Silicon
  # DMG from the staged darwin JRE, backend, UI and tools, and item 50's four packaged specs run
  # against the app installed from that DMG. No Docker/Xvfb: macOS runs the window itself.
  macos-dmg:
    name: macOS (DMG + packaged e2e)
    needs: [macos-backend-check, macos-frontend-check]
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/jvm-toolchain
        with:
          downloads-cache: 'true'
      - uses: ./.github/actions/node-toolchain
        with:
          cache-dependency-path: |
            desktop/pnpm-lock.yaml
            e2e/pnpm-lock.yaml
      - name: Cache the desktop downloads (Temurin, whisper-cli, ffmpeg, Electron)
        uses: actions/cache@v6
        with:
          path: |
            desktop/dist/downloads
            ~/.cache/electron
            ~/.cache/electron-builder
          key: desktop-downloads-${{ runner.os }}-${{ hashFiles('versions.json', 'desktop/package.json') }}
          restore-keys: desktop-downloads-${{ runner.os }}-
      - name: Build the backend, the UI, the tools and the fixtures
        run: |
          set -euo pipefail
          ./gradlew -p backend installDist
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend build
          ./gradlew prepareRuntime prepareE2eFixtures
      - name: Install the desktop and e2e packages
        run: |
          set -euo pipefail
          pnpm --dir desktop install --frozen-lockfile
          pnpm --dir e2e install --frozen-lockfile
      - name: Check the desktop package and specs (format, types)
        run: |
          set -euo pipefail
          pnpm --dir desktop test
          pnpm --dir e2e exec tsc -p desktop/tsconfig.json
      - name: Build the DMG
        run: |
          set -euo pipefail
          pnpm --dir desktop fetch:jdk
          pnpm --dir desktop dist:mac
      # The same pinned fixtures and models the Linux desktop job exports; the sha256 values the
      # first-run spec asserts against come from versions.json.
      - name: Export the fixture and model environment
        run: |
          set -euo pipefail
          cache="${GRADLE_USER_HOME:-$HOME/.gradle}/stt-app"
          tiny=$(find "$cache/models" -maxdepth 1 -name '*ggml-tiny.en.bin' | head -n 1)
          speaker=$(find "$cache/models" -maxdepth 1 -name '*campplus*voxceleb_16k.onnx' | head -n 1)
          jfk=$(find "$cache/fixtures" -maxdepth 1 -name '*jfk.wav' | head -n 1)
          for file in "$tiny" "$speaker" "$jfk"; do
            [ -n "$file" ] || { echo "a pinned fixture or model is missing from $cache" >&2; exit 1; }
          done
          {
            echo "TEST_WHISPER_TINY_EN_MODEL=$tiny"
            echo "STT_SPEAKER_MODEL=$speaker"
            echo "TEST_JFK_WAV=$jfk"
            echo "TEST_WHISPER_TINY_EN_SHA256=$(jq -er '.models.whisperTinyEn.sha256' versions.json)"
            echo "TEST_SPEAKER_SHA256=$(jq -er '.models.speaker.sha256' versions.json)"
          } >> "$GITHUB_ENV"
      - name: Mount the DMG and install the app
        run: |
          set -euo pipefail
          dmg=$(find desktop/dist -maxdepth 1 -name '*.dmg' | head -n 1)
          [ -n "$dmg" ] || { echo 'no DMG was built' >&2; exit 1; }
          mount=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          app=$(find "$mount" -maxdepth 1 -name '*.app' | head -n 1)
          [ -n "$app" ] || { echo 'no .app in the DMG' >&2; exit 1; }
          appdir=$(mktemp -d)
          cp -R "$app" "$appdir/"
          hdiutil detach "$mount"
          name=$(basename "$app" .app)
          echo "STT_DESKTOP_APP=$appdir/$name.app/Contents/MacOS/$name" >> "$GITHUB_ENV"
      # Roadmap item 69 (test-list item 5): the packaged app's tools are the audio-only ffmpeg from
      # the pinned asset — one binary, no ffprobe, the audio-only configure line — not bytedeco's
      # full GPL build. The journey spec then transcribes an upload through it.
      - name: Assert the packaged ffmpeg is the audio-only build
        run: |
          set -euo pipefail
          resources="$(cd "$(dirname "$STT_DESKTOP_APP")/../Resources" && pwd)"
          tools="$resources/tools/bin"
          [ -x "$tools/ffmpeg" ] || {
            echo "no executable ffmpeg in $tools" >&2
            ls -l "$tools" >&2
            exit 1
          }
          if [ -e "$tools/ffprobe" ]; then
            echo 'the packaged tools still ship ffprobe' >&2
            exit 1
          fi
          version=$("$tools/ffmpeg" -hide_banner -version)
          configuration=$(sed -n 's/^configuration: //p' <<<"$version" | tr -d "'")
          case $configuration in
            *--disable-everything*) ;;
            *)
              echo "ffmpeg is not the audio-only build; configuration: $configuration" >&2
              exit 1
              ;;
          esac
          if [[ $configuration == *--enable-lib* ]]; then
            echo "the audio-only build enables an external library: $configuration" >&2
            exit 1
          fi
          echo "packaged ffmpeg: $(head -n 1 <<<"$version")"
      - name: Upload the DMG
        uses: actions/upload-artifact@v4
        with:
          name: Speech-to-Text-macos-arm64-dmg
          path: desktop/dist/*.dmg
          retention-days: 30
      - name: Run the packaged desktop e2e
        working-directory: e2e
        run: >-
          pnpm exec playwright test -c playwright.desktop.config.ts
          01-journey.spec.ts 02-quit.spec.ts 03-first-run.spec.ts 04-model-download-failure.spec.ts

  # Manual tool (roadmap item 48, aligned with item 63's `desktop-whisper-cpp-v1` release): the
  # pinned jiang1997 darwin prebuild's binaries load libggml-metal/libggml-blas dylibs the tarball
  # does not ship, so whisper-cli cannot start on macOS. This builds a static 1.8.4 Metal binary
  # on the runner, checks it has no @rpath dependency, and uploads the tar as a workflow artifact.
  # The user publishes it as the macOS asset of `desktop-whisper-cpp-v1`
  # (`whisper-cpp-1.8.4-aarch64-darwin.tar.gz`; .tar.gz because the Gradle bootstrap extracts it
  # without a zstd dependency, unlike item 63's Nix artifact); the bootstrap pin is then updated
  # (agents never publish to GitHub).
  macos-whisper-asset:
    name: macOS whisper-cli asset (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.assets
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build whisper.cpp 1.8.4 (static, Metal + Accelerate)
        run: |
          set -euo pipefail
          cmake --version >/dev/null || brew install cmake
          curl -fsSL https://github.com/ggml-org/whisper.cpp/archive/refs/tags/v1.8.4.tar.gz -o whisper.tar.gz
          tar xzf whisper.tar.gz
          cmake -S whisper.cpp-1.8.4 -B build -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DGGML_METAL=ON -DGGML_BLAS=ON -DGGML_BLAS_VENDOR=Apple \
            -DWHISPER_COREML=OFF -DWHISPER_SDL2=OFF -DWHISPER_BUILD_TESTS=OFF
          cmake --build build --config Release -j
          build/bin/whisper-cli --help >/dev/null
          if otool -L build/bin/whisper-cli | grep -q '@rpath'; then
            echo "the binary still loads an @rpath library:" >&2
            otool -L build/bin/whisper-cli
            exit 1
          fi
      - name: Package and print the sha256
        run: |
          set -euo pipefail
          mkdir -p stage/bin
          cp build/bin/whisper-cli stage/bin/
          tar -czf whisper-cpp-1.8.4-aarch64-darwin.tar.gz -C stage .
          shasum -a 256 whisper-cpp-1.8.4-aarch64-darwin.tar.gz | tee sha256.txt
          echo "### whisper-cpp asset" >> "$GITHUB_STEP_SUMMARY"
          cat sha256.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: whisper-cpp-1.8.4-aarch64-darwin
          path: whisper-cpp-1.8.4-aarch64-darwin.tar.gz
          retention-days: 90

  # Manual tool (roadmap item 69, the macOS counterpart of `macos-whisper-asset`; opt-in like it,
  # via the `assets` dispatch input): builds the shared audio-only recipe for aarch64-darwin,
  # proves its surface with `ffmpeg-audio-only` (one binary, no ffprobe/ffplay, `otool -L` names
  # only system libraries, the configure line's exact component sets) and packages it as the
  # `.tar.gz` that the flake pin, `./gradlew prepareRuntime` and the DMG all consume. The user
  # publishes the tar under the `desktop-ffmpeg-v2` release (a new tag only if the enable list or
  # the nixpkgs pin changes) and pastes the printed pin into nix/desktop-artifacts.nix; agents
  # never publish.
  macos-ffmpeg-asset:
    name: macOS ffmpeg asset (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.assets
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix-toolchain
      - name: Build the audio-only ffmpeg and prove its surface
        run: nix run --print-build-logs .#ffmpeg-audio-only
      # Roadmap item 69 (the root review's finding 1): packaging comes before everything that
      # reads the recorded pin. A stale pin fails at evaluation, and this job exists to rebuild the
      # asset after exactly the change that makes a pin stale — so it must always produce and print
      # the asset and its new pin, and only then report the stale pin.
      - name: Package the asset, print the pin
        run: |
          set -euo pipefail
          nix build --print-build-logs .#desktop-ffmpeg-asset
          cat result/pin.nix
          # `result` is a symlink into the store; `find -L` looks through it (plain `find` would
          # stop at the link and report no asset).
          asset=$(find -L result -maxdepth 1 -name '*.tar.gz' -print -quit)
          if [ -z "$asset" ]; then
            echo "no .tar.gz in the asset output:" >&2
            ls -l result >&2
            exit 1
          fi
          cp "$asset" .
          name=$(basename "$asset")
          shasum -a 256 "$name" | tee sha256.txt
          {
            echo "### ffmpeg asset"
            echo '```'
            cat result/pin.nix
            echo '```'
            cat sha256.txt
          } >> "$GITHUB_STEP_SUMMARY"
      # Roadmap item 69 (test-list item 2): item 62's proofs, unchanged, on the binary this job
      # built — all 19 accepted upload formats decoded to the canonical FLAC (validated from its
      # STREAMINFO) and the app's f32le decode, silencedetect, atrim and concat commands
      # (nix/ffmpeg-upload-formats.sh, nix/ffmpeg-app-uses.sh). The flake checks of the same name
      # prove the pinned prebuilt; this app runs the scripts on the source build, so a stale pin
      # cannot fail them.
      - name: Prove the fixtures and the app's commands on this build
        run: nix run --print-build-logs .#ffmpeg-source-surface
      # Roadmap item 69 (test-list item 3): the recorded pin names this job's build (store path and
      # references) and this asset (sha256 and url). It runs after packaging, so the asset and the
      # new pin are printed even when the recorded pin is the reason the job fails. `nix flake
      # check` proves the default package's closure ships the prebuilt output and not the source
      # (`ffmpeg-audio-only-everywhere`, a darwin check).
      - name: Prove the recorded pin matches the built asset
        run: nix run --print-build-logs .#ffmpeg-asset-pin
      # The tar is what the user publishes: upload it even when the pin proof failed above.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ffmpeg-audio-only-aarch64-darwin
          path: '*.tar.gz'

  # The Gradle tree on Windows (roadmap item 49). No Nix job: Windows has no Nix path, so these are
  # the automated runs of the spawn seam, the probe parsing, the queue and the frontend on a Windows
  # host. The runner has no GPU; the startup probe therefore reports zero GPUs (the CPU fallback is
  # the tested path), and a real-GPU run stays user-verified (item 49's approval log).
  windows-backend-check:
    name: Windows (gradle check)
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/jvm-toolchain
      - name: gradlew.bat checkVersions
        shell: cmd
        run: gradlew.bat checkVersions
      - name: gradlew.bat -p backend check
        shell: cmd
        run: gradlew.bat -p backend check

  windows-frontend-check:
    name: Windows (pnpm test, pnpm build)
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-toolchain
        with:
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: pnpm test
        run: pnpm test
      - name: pnpm build
        run: pnpm build

  # The portable Windows zip, built and tested the way item 49 ships it (roadmap item 49's
  # packaged-zip item): electron-builder packs the staged app, the zip is unpacked like a user's
  # download, and items 50's packaged specs 01-04 run against it in the unpacked directory. No
  # Xvfb and no Nix: Windows runs the window itself, and everything comes from the package.
  windows-desktop-zip:
    name: Windows (packaged zip e2e)
    runs-on: windows-2025
    needs: [backend-check, frontend-check]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/jvm-toolchain
        with:
          downloads-cache: 'true'
      - uses: ./.github/actions/node-toolchain
        with:
          cache-dependency-path: |
            desktop/pnpm-lock.yaml
            e2e/pnpm-lock.yaml
      - name: Cache the desktop downloads (Temurin, whisper-cli, ffmpeg, Electron)
        uses: actions/cache@v6
        with:
          path: |
            desktop/dist/downloads
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: desktop-downloads-${{ runner.os }}-${{ hashFiles('versions.json', 'desktop/package.json') }}
          restore-keys: desktop-downloads-${{ runner.os }}-
      - name: Build the backend and the UI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\gradlew.bat -p backend installDist
          if ($LASTEXITCODE -ne 0) { throw 'backend installDist failed' }
          pnpm --dir frontend install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'frontend install failed' }
          pnpm --dir frontend build
          if ($LASTEXITCODE -ne 0) { throw 'frontend build failed' }
      - name: Fetch the runtime tools, models and fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\gradlew.bat prepareRuntime prepareE2eFixtures
          if ($LASTEXITCODE -ne 0) { throw 'prepareRuntime failed' }
      - name: Install the desktop and e2e packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm --dir desktop install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'desktop install failed' }
          pnpm --dir e2e install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'e2e install failed' }
      - name: Check the desktop package and specs (format, types)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm --dir desktop test
          if ($LASTEXITCODE -ne 0) { throw 'desktop checks failed' }
          pnpm --dir e2e exec tsc -p desktop/tsconfig.json
          if ($LASTEXITCODE -ne 0) { throw 'spec type check failed' }
      - name: Build the portable zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm --dir desktop fetch:jdk
          if ($LASTEXITCODE -ne 0) { throw 'fetch:jdk failed' }
          pnpm --dir desktop dist:win
          if ($LASTEXITCODE -ne 0) { throw 'electron-builder failed' }
      - name: Unpack the zip like a user's download
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-ChildItem desktop\dist\Speech-to-Text-*-win-x64.zip | Select-Object -First 1
          if (-not $zip) { throw 'no portable zip was produced' }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath desktop\dist\portable -Force
          $app = Get-ChildItem desktop\dist\portable -Recurse -Filter 'Speech-to-Text.exe' |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $app) { throw 'no Speech-to-Text.exe in the unpacked zip' }
          # Chromium's sandboxed child processes run with a restricted token that must read and
          # execute the app's files. An install directory's ACL grants that (ALL RESTRICTED
          # APPLICATION PACKAGES, S-1-15-2-2); the runner workspace's inherited ACL does not, and
          # without it the GPU process dies at startup (0x80000003) and the browser aborts.
          icacls desktop\dist\portable /grant "*S-1-15-2-2:(OI)(CI)(RX)" /T /C /Q | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'granting the sandbox read/execute ACL failed' }
          "STT_DESKTOP_APP=$app" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # The specs read the same pinned fixtures and models the other jobs use, from the Gradle
      # cache; the sha256 values the first-run spec asserts against come from versions.json.
      - name: Export the fixture and model environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cache = Join-Path $env:GRADLE_USER_HOME 'stt-app'
          $tiny = Get-ChildItem (Join-Path $cache 'models') -Filter '*ggml-tiny.en.bin' | Select-Object -First 1
          $speaker = Get-ChildItem (Join-Path $cache 'models') -Filter '*campplus*voxceleb_16k.onnx' | Select-Object -First 1
          $jfk = Get-ChildItem (Join-Path $cache 'fixtures') -Filter '*jfk.wav' | Select-Object -First 1
          if (-not $tiny -or -not $speaker -or -not $jfk) { throw "a pinned fixture or model is missing from $cache" }
          $versions = Get-Content versions.json | ConvertFrom-Json
          @(
            "TEST_WHISPER_TINY_EN_MODEL=$($tiny.FullName)",
            "STT_SPEAKER_MODEL=$($speaker.FullName)",
            "TEST_JFK_WAV=$($jfk.FullName)",
            "TEST_WHISPER_TINY_EN_SHA256=$($versions.models.whisperTinyEn.sha256)",
            "TEST_SPEAKER_SHA256=$($versions.models.speaker.sha256)"
          ) | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Run the packaged desktop e2e
        shell: pwsh
        working-directory: e2e
        env:
          # Chromium's own log (captured from the app's stderr) names a sandbox/GPU abort that
          # otherwise only shows up as the 0x80000003 exit code.
          ELECTRON_ENABLE_LOGGING: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm exec playwright test -c playwright.desktop.config.ts 01-journey.spec.ts 02-quit.spec.ts 03-first-run.spec.ts 04-model-download-failure.spec.ts
          if ($LASTEXITCODE -ne 0) { throw 'the packaged specs failed' }

  # The Windows whisper-cli asset (manual, roadmap item 49). The published prebuilts are not
  # self-contained: the pinned tarball and ggml-org's own Windows zip both hard-import the MSVC
  # runtime (MSVCP140/VCRUNTIME140/VCOMP140, the last from OpenMP) and the pinned Vulkan build also
  # imports vulkan-1.dll, so a stock Windows install fails with 0xC0000135 before a single word is
  # transcribed. The prebuilts cannot be fixed without rebuilding, so this job builds whisper.cpp
  # 1.8.4 with the static MSVC CRT (the top-level project pins CMake 3.5, so the runtime variable is
  # ignored and the Release flags carry /MT), ggml's own Win32 thread pool instead of OpenMP
  # (GGML_OPENMP=OFF removes vcomp140.dll; ggml-cpu's threadpool still uses every core), and the
  # pinned LunarG SDK's vulkan-1.dll beside the exes: the loader picks up a driver's ICD when one
  # exists and enumerates zero devices otherwise, which is the CPU fallback. The loader is
  # Apache-2.0 and built with the static CRT. The tarball also carries the four MSVC redistributable
  # runtime DLLs: ONNX Runtime's Windows native (diarization) imports them, and stock Windows has no
  # VC++ runtime. The job fails unless the exes and the loader import no VC runtime and the JFK clip
  # transcribes on CPU through the bundled loader — the packaged-app items extend this asset with
  # the same staged DLLs.
  windows-whisper-asset:
    name: Windows whisper-cli asset (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.assets
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # Pin the loader/header version the release repo builds against (1.4.309.0), so a later SDK
      # cannot silently change what ships beside whisper-cli.exe.
      - name: Install the Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true
      - name: Build whisper.cpp 1.8.4 (static CRT, no OpenMP, Vulkan)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          curl.exe -fsSL https://github.com/ggml-org/whisper.cpp/archive/refs/tags/v1.8.4.tar.gz -o whisper.tar.gz
          if ($LASTEXITCODE -ne 0) { throw "downloading whisper.cpp failed" }
          tar xzf whisper.tar.gz
          if ($LASTEXITCODE -ne 0) { throw "extracting whisper.cpp failed" }
          cmake -S whisper.cpp-1.8.4 -B build -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_SHARED_LIBS=OFF `
            -DGGML_VULKAN=1 `
            -DGGML_NATIVE=OFF `
            -DGGML_OPENMP=OFF `
            -DWHISPER_SDL2=OFF `
            -DWHISPER_BUILD_TESTS=OFF `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DCMAKE_C_FLAGS_RELEASE='/MT /O2 /Ob2 /DNDEBUG' `
            -DCMAKE_CXX_FLAGS_RELEASE='/MT /O2 /Ob2 /DNDEBUG'
          if ($LASTEXITCODE -ne 0) { throw "configuring whisper.cpp failed" }
          cmake --build build --config Release -j 4
          if ($LASTEXITCODE -ne 0) { throw "building whisper.cpp failed" }
      - name: Build the pinned Vulkan loader
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The SDK ships only the loader's import library (Lib\vulkan-1.lib); the runtime DLL is not
          # in its payload, and the separate VulkanRT installer wraps it in a nested archive. Build
          # the loader from source at the same pinned SDK tag instead: its CMake selects the static
          # MSVC CRT on Windows unless asked otherwise, so the result imports no VC runtime.
          $tag = 'vulkan-sdk-1.4.309.0'
          foreach ($repo in @('Vulkan-Headers', 'Vulkan-Loader')) {
            curl.exe -fsSL "https://github.com/KhronosGroup/$repo/archive/refs/tags/$tag.tar.gz" -o "$repo.tar.gz"
            if ($LASTEXITCODE -ne 0) { throw "downloading $repo failed" }
            tar xzf "$repo.tar.gz"
            if ($LASTEXITCODE -ne 0) { throw "extracting $repo failed" }
          }
          cmake -S "Vulkan-Headers-$tag" -B headers-build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_INSTALL_PREFIX=$PWD\vk-headers"
          if ($LASTEXITCODE -ne 0) { throw "configuring Vulkan-Headers failed" }
          cmake --install headers-build --config Release
          if ($LASTEXITCODE -ne 0) { throw "installing Vulkan-Headers failed" }
          cmake -S "Vulkan-Loader-$tag" -B loader-build "-DVULKAN_HEADERS_INSTALL_DIR=$PWD\vk-headers" -DBUILD_TESTS=OFF
          if ($LASTEXITCODE -ne 0) { throw "configuring Vulkan-Loader failed" }
          cmake --build loader-build --config Release --target vulkan
          if ($LASTEXITCODE -ne 0) { throw "building the Vulkan loader failed" }
          if (-not (Test-Path 'loader-build\loader\Release\vulkan-1.dll')) {
            throw "the Vulkan loader build produced no vulkan-1.dll"
          }
      - name: Stage the tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = 'stage\whisper-1.8.4-windows-x64'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item 'build\bin\Release\whisper-cli.exe', 'build\bin\Release\whisper-server.exe' $stage
          Copy-Item 'loader-build\loader\Release\vulkan-1.dll' $stage

          # The app's ONNX Runtime native (diarization) is built against the dynamic MSVC CRT:
          # onnxruntime.dll imports MSVCP140/MSVCP140_1/VCRUNTIME140/VCRUNTIME140_1, which stock
          # Windows lacks. Ship Microsoft's redistributable runtime DLLs from the runner's VS
          # redist beside the tools; the extracted directory is on the app's PATH, and the
          # packaged-app items stage the same tarball.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $crtDir =
            (Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT\msvcp140.dll" |
              Sort-Object FullName | Select-Object -Last 1).DirectoryName
          if (-not $crtDir) { throw "no MSVC runtime redist under $vs" }
          foreach ($dll in @('msvcp140.dll', 'msvcp140_1.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
            if (-not (Test-Path (Join-Path $crtDir $dll))) { throw "missing $dll in $crtDir" }
            Copy-Item (Join-Path $crtDir $dll) $stage
          }
          "Staged MSVC runtime from $crtDir"
      - name: Verify the imports
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = 'stage\whisper-1.8.4-windows-x64'

          # dumpbin is not on PATH in a plain runner shell: it comes from the VS installation.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = (Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -Last 1).FullName
          if (-not ((& $dumpbin /nologo /headers "$stage\vulkan-1.dll") | Select-String 'machine \(x64\)')) {
            throw "the built vulkan-1.dll is not x64"
          }
          function Imports([string] $path) {
            (& $dumpbin /nologo /dependents $path) |
              Select-String -Pattern '^\s+\S+\.dll\s*$' |
              ForEach-Object { ($_.Line -split '\s+')[1] }
          }
          foreach ($binary in @("$stage\whisper-cli.exe", "$stage\whisper-server.exe", "$stage\vulkan-1.dll")) {
            $imports = Imports $binary
            "Imports of $(Split-Path $binary -Leaf): $($imports -join ', ')"
            $runtime = $imports | Where-Object { $_ -match '^(msvcp|vcruntime|vcomp)' }
            if ($runtime) { throw "$(Split-Path $binary -Leaf) imports the VC runtime: $runtime" }
          }
      - name: Transcribe the JFK clip on CPU through the bundled loader
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = 'stage\whisper-1.8.4-windows-x64'
          $v = Get-Content versions.json | ConvertFrom-Json
          Invoke-WebRequest $v.models.whisperTinyEn.url -OutFile tiny.bin
          Invoke-WebRequest $v.fixtures.jfkWav.url -OutFile jfk.wav
          $output = & "$stage\whisper-cli.exe" -m tiny.bin -f jfk.wav -nt 2>&1
          if ($LASTEXITCODE -ne 0) { throw "whisper-cli failed on the JFK clip: $output" }
          $output | Select-Object -Last 5
          if (-not ($output -match 'ask not what your country can do for you')) { throw "the JFK clip did not transcribe" }
      - name: Package and print the sha256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          tar -czf whisper-cpp-1.8.4-windows-x64.tar.gz -C stage whisper-1.8.4-windows-x64
          if ($LASTEXITCODE -ne 0) { throw "packaging failed" }
          $sha = (Get-FileHash whisper-cpp-1.8.4-windows-x64.tar.gz -Algorithm SHA256).Hash.ToLower()
          "$sha  whisper-cpp-1.8.4-windows-x64.tar.gz"
          "### whisper-cpp Windows asset" >> $env:GITHUB_STEP_SUMMARY
          "$sha  whisper-cpp-1.8.4-windows-x64.tar.gz" >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: whisper-cpp-1.8.4-windows-x64
          path: whisper-cpp-1.8.4-windows-x64.tar.gz
          retention-days: 90

  # The Linux desktop artifact, built and tested the way item 50 ships it: electron-builder builds
  # the .deb, apt installs it as a user would (its declared Depends pull the runtime libraries the
  # bundled Electron, whisper-cli and ffmpeg are linked against), and the packaged specs run
  # against the installed /usr/bin/stt-app under Xvfb. The runner is the clean machine here;
  # e2e/desktop/run-in-docker.ts (the dev entry point) exists for hosts whose /nix/store supplies
  # the node, Xvfb and fixtures it insists on, which is why CI does not go through the container.
  desktop-e2e:
    name: Desktop (packaged .deb e2e)
    runs-on: ubuntu-24.04
    needs: [backend-check, frontend-check]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # The JDK is also what jlink links the bundled runtime image from; the prepare tasks below
      # bring the pinned tools, models and fixtures into the ~/.gradle/stt-app cache the other jobs
      # share (one key, the same pins).
      - uses: ./.github/actions/jvm-toolchain
        with:
          downloads-cache: 'true'
      - uses: ./.github/actions/node-toolchain
        with:
          cache-dependency-path: |
            desktop/pnpm-lock.yaml
            e2e/pnpm-lock.yaml
      - name: Cache the desktop downloads (Temurin, whisper-cli, ffmpeg, Electron, fpm)
        uses: actions/cache@v6
        with:
          path: |
            desktop/dist/downloads
            ~/.cache/electron
            ~/.cache/electron-builder
          key: desktop-downloads-${{ runner.os }}-${{ hashFiles('versions.json', 'desktop/package.json') }}
          restore-keys: desktop-downloads-${{ runner.os }}-
      - name: Build the backend, the UI, the tools and the fixtures
        run: |
          set -euo pipefail
          ./gradlew -p backend installDist
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend build
          ./gradlew prepareRuntime prepareE2eFixtures
      - name: Install the desktop and e2e packages
        run: |
          set -euo pipefail
          pnpm --dir desktop install --frozen-lockfile
          pnpm --dir e2e install --frozen-lockfile
      # ADR 0054: the desktop package's own gate (prettier + tsc over the app and its scripts) and
      # the type check of the desktop harness and specs, before anything is built from them.
      - name: Check the desktop package and specs (format, types)
        run: |
          set -euo pipefail
          pnpm --dir desktop test
          pnpm --dir e2e exec tsc -p desktop/tsconfig.json
      # electron-builder fetches its own fpm and Electron here: USE_SYSTEM_FPM is the devenv's
      # Nix-shell workaround (ADR 0010) and is deliberately not set in CI.
      - name: Build the .deb
        run: |
          set -euo pipefail
          pnpm --dir desktop fetch:jdk
          pnpm --dir desktop dist
      # The .deb's glibc floor (2.38): apt in a stock ubuntu:22.04 container (glibc 2.35) must
      # refuse it naming libc6. The 24.04 half is this runner's install and the specs below.
      - name: Check that apt refuses the .deb below its glibc floor
        run: pnpm --dir e2e test:desktop:deb-floor
      - name: Install the .deb and Xvfb the way a user would
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ./desktop/dist/stt-app_*_amd64.deb xvfb
      # The specs read the same pinned fixtures and models the other jobs use, from the Gradle
      # cache. The file names are globbed — the build prefixes them with the pin's sha256, and that
      # naming must not be duplicated here — while the sha256 values the first-run spec asserts
      # against come from versions.json.
      - name: Export the fixture and model environment
        run: |
          set -euo pipefail
          cache="${GRADLE_USER_HOME:-$HOME/.gradle}/stt-app"
          tiny=$(find "$cache/models" -maxdepth 1 -name '*ggml-tiny.en.bin' -print -quit)
          speaker=$(find "$cache/models" -maxdepth 1 -name '*campplus*voxceleb_16k.onnx' -print -quit)
          jfk=$(find "$cache/fixtures" -maxdepth 1 -name '*jfk.wav' -print -quit)
          for file in "$tiny" "$speaker" "$jfk"; do
            [ -n "$file" ] || { echo "a pinned fixture or model is missing from $cache" >&2; exit 1; }
          done
          {
            echo "TEST_WHISPER_TINY_EN_MODEL=$tiny"
            echo "STT_SPEAKER_MODEL=$speaker"
            echo "TEST_JFK_WAV=$jfk"
            echo "TEST_WHISPER_TINY_EN_SHA256=$(jq -er '.models.whisperTinyEn.sha256' versions.json)"
            echo "TEST_SPEAKER_SHA256=$(jq -er '.models.speaker.sha256' versions.json)"
          } >> "$GITHUB_ENV"
      # The exact-model-host spec (14) needs raw.githubusercontent.com to lead back to its own
      # loopback fixture (the container harness passes docker --add-host instead). Nothing after
      # this step fetches from that host.
      - name: Map raw.githubusercontent.com to loopback for the model-host spec
        run: echo '127.0.0.1 raw.githubusercontent.com' | sudo tee -a /etc/hosts
      # Xvfb: Electron needs a display even headless, and the specs assert the window it opens.
      # The specs run from e2e/, the way the container harness runs them from /e2e: the desktop
      # config's testDir is relative to it.
      - name: Run the packaged desktop e2e
        working-directory: e2e
        run: xvfb-run -a pnpm exec playwright test -c playwright.desktop.config.ts

  # The desktop app's flake package (ADR 0053), tested the way `pnpm --dir e2e test:desktop:nix`
  # tests it on a developer's machine: `nix build .#desktop` on the runner, then the same packaged
  # specs in a stock ubuntu:24.04 container that installs nothing — the app runs from the
  # read-only /nix/store mount, its closure being its whole runtime. The devenv shell supplies what
  # the harness insists on (the store-path fixtures, node, Xvfb, pnpm). The runner is Ubuntu 24.04
  # with AppArmor, so this job is also where Chromium's sandbox meets the user-namespace
  # restriction that store-installed Electron (no setuid helper) has to live with.
  desktop-nix-e2e:
    name: Desktop (flake package e2e)
    runs-on: ubuntu-24.04
    needs: [backend-check, frontend-check]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix-toolchain
      - name: Install the devenv CLI
        run: nix profile install nixpkgs#devenv
      - name: Build the flake package and run the packaged desktop e2e against it
        run: >-
          devenv shell -- bash -euo pipefail -c
          'pnpm --dir e2e install --frozen-lockfile && pnpm --dir e2e test:desktop:nix'

  # The desktop bundle (ADR 0053), tested the way `pnpm --dir e2e test:desktop:bundle` tests it on a
  # developer's machine: `nix build .#desktop-bundle` on the runner, then the packaged specs in a
  # stock alpine:3.20 container with only zstd and tar added — no Nix, no glibc. The GPU suites
  # (test:desktop:bundle:amd, :nvidia) need a GPU and run on a developer's machine: no runner has
  # one. The bundle's Vulkan-only Mesa comes from the pinned release asset (roadmap item 56, a
  # prerelease whose sha256 is in nix/desktop-artifacts.nix), so it is fetched here, not compiled.
  # Two runner preparations: every spec launch unpacks the bundle into a
  # fresh HOME (~1.2 GB each, ~10 GB in the container), so preinstalled toolchains this job does not
  # use are removed first; and the bundle needs unprivileged user namespaces (its README
  # requirement), which Ubuntu 24.04's AppArmor can restrict — the `.deb` is the answer for such
  # hosts, so the runner is made a host that meets the bundle's requirement.
  # It gates merges through the `ci` aggregator: roadmap 55 fixed the flaky writer-lock probe and
  # item 56 took the Mesa build out of this job, the two conditions its first version named. The
  # Nix build here runs the backend's `gradle check`, so item 58's real-time completion waits can
  # still fail it — as they can the already-required `desktop-nix-e2e` and `nix-build`.
  desktop-bundle-e2e:
    name: Desktop (bundle e2e)
    runs-on: ubuntu-24.04
    needs: [backend-check, frontend-check]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space for the unpacked bundles
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Allow unprivileged user namespaces (the bundle's host requirement)
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: ./.github/actions/nix-toolchain
      - name: Install the devenv CLI
        run: nix profile install nixpkgs#devenv
      - name: Build the bundle and run the packaged desktop e2e against it
        run: >-
          devenv shell -- bash -euo pipefail -c
          'pnpm --dir e2e install --frozen-lockfile && pnpm --dir e2e test:desktop:bundle'

  # The three Nix checks run in parallel, but GitHub Actions cache keys are immutable: the first
  # job to save wins. Only `nix-build` writes the shared cache, because it materializes the full
  # package closure including the expensive whisper-cpp Vulkan output; the other jobs restore it
  # read-only. The cache key uses a new v2 namespace to get past the old small entry.
  # Each of the three Nix jobs checks out the sources and restores the same store cache; only
  # `nix-build` may write it (cache-nix-action saves in a post step that runs on `success()`).
  nix-devenv:
    name: Nix (devenv shell)
    runs-on: ubuntu-24.04
    needs: [backend-check, frontend-check]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix-toolchain
      # The repository pins every tool in devenv.nix and flake.nix; the devenv CLI itself is the
      # bootstrap (ADR 0010) and is not pinned there, so it comes from nixpkgs, the same way a
      # developer's machine installs it.
      - name: Install the devenv CLI
        run: nix profile install nixpkgs#devenv
      # The workflows are linted with the actionlint the devenv pins (ADR 0010), so a YAML mistake or
      # a bad `${{ … }}` expression fails in CI instead of at the next push — the reason
      # `pkgs.actionlint` was added. actionlint 1.7.12 checks workflow files only, so the composite
      # `action.yml` files are still reviewed by hand.
      - name: actionlint the workflows
        run: devenv shell -- actionlint .github/workflows/*.yml
      # The dev shell's own test list (devenv.nix enterTest): node, JDK 21 with Gradle and Kotlin,
      # whisper-cli, ffmpeg, sqlite3, curl, jq and the model hashes.
      - name: devenv test
        run: devenv test

  nix-flake-check:
    name: Nix (flake check)
    runs-on: ubuntu-24.04
    needs: [backend-check, frontend-check]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix-toolchain
      - name: nix flake check
        run: nix flake check --print-build-logs

  nix-build:
    name: Nix (build)
    runs-on: ubuntu-24.04
    needs: [backend-check, frontend-check]
    timeout-minutes: 60
    steps:
      # The sources are required twice over: the toolchain's key step hashes flake.lock,
      # devenv.lock, devenv.yaml, devenv.nix, nix/** and the pins in versions.json, and
      # `nix build` builds the flake in the workspace.
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix-toolchain
        with:
          save-cache: 'true'
      - name: nix build
        run: nix build --print-build-logs


  # The pinned model downloads are the only requests the app itself makes (ADR 0055). A provider can
  # move its CDN under us, so once a week this walks each pin's redirect chain with a ranged GET and
  # fails naming the hop that left the allowlist — before a user's first run finds out. It reads
  # versions.json and needs no build, so it is a two-second job. Deliberately not in the `ci`
  # aggregator: a weekly network check must not gate a pull request.
  model-hosts:
    name: Pinned model hosts resolve
    if: github.event_name == 'schedule' && github.event.schedule == '0 4 * * 1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-toolchain
        with:
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: Check the model download hosts
        run: node desktop/check-model-hosts.ts

  # The one required check for branch protection: it waits for every other job and fails when any of
  # them did. A *skipped* job does not fail it, so a conditional job cannot break the gate, and
  # renaming a job cannot silently un-gate merges. `model-hosts` is the one deliberate exception
  # (its own comment says why); a job absent from this list cannot gate merges.
  ci:
    name: CI (all checks)
    needs: [backend-check, frontend-check, docs-check, backend-integration, e2e, desktop-e2e, desktop-nix-e2e, desktop-bundle-e2e, nix-devenv, nix-flake-check, nix-build, macos-backend-check, macos-frontend-check, macos-backend-integration, macos-e2e, macos-nix, macos-dmg, windows-backend-check, windows-frontend-check, windows-desktop-zip]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report the job results
        run: |
          echo "job results: ${{ join(needs.*.result, ' ') }}"
      - name: Every job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "at least one job failed or was cancelled" >&2
          exit 1
