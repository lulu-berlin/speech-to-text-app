# docker-compose setup (roadmap item 19): one service, CPU by default — no GPU is passed
# in, so the Settings page's device (automatic by default) finds none and uses the CPU.
#
# The GPU variants are the override files beside this one (docker-compose.gpu-*.yml; their
# headers and README.md § Docker give the commands). Every variant is the same service, so
# `down`, `exec stt-app` and `logs` work identically and no second container competes for
# 8080 (compose profiles were tried first and could not do that: a service without a
# profile always starts too).
#
# Data lives in the named volume stt-data mounted at /data (STT_DATA_DIR); the container
# runs as the non-root stt user (uid 1000) and writes only there. The healthcheck uses
# curl from the image (flake output docker-root) against the app's own /api/health. init: true
# makes docker-init (a static tini) PID 1 so orphaned process trees are reaped (ADR 0020).

services:
  stt-app:
    image: stt-app:local
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      STT_DATA_DIR: /data
    volumes:
      - stt-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  stt-data:
    name: stt-data
