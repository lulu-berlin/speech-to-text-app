# NVIDIA override (roadmap item 19), layered on docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.gpu-nvidia.yml up -d
#
# The host needs the NVIDIA Container Toolkit with a CDI spec for `nvidia.com/gpu`: on
# NixOS `hardware.nvidia-container-toolkit.enable = true;` generates it; elsewhere
# `nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml`. Docker must have CDI enabled
# (`"features": {"cdi": true}` in daemon.json where it is not the default). The toolkit
# mounts the driver (including its Vulkan ICD); the image brings the libraries it links
# (flake output docker-root). The Settings page then lists the GPU, and the device
# setting's default (automatic) uses it.
services:
  stt-app:
    devices:
      - nvidia.com/gpu=all
