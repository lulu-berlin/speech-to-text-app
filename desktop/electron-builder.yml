# Roadmap item 50: the Linux desktop artifact is a .deb (decided 2026-10-14 — Ubuntu 23.10+
# blocks the Chromium sandbox for unpacked archives; a root install keeps it on). The app
# files are staged by stage.ts into dist/stage/** (backend installDist lib/, frontend
# dist/, the jlink image, whisper-cli and ffmpeg) and packaged by electron-builder. Data, not
# code (ADR 0054): the app's own code is the tsc output in build/.
#
# Resources layout inside the package (extraResources are copied below resources/):
#   jre/           jlink runtime image (bin/java + lib/)
#   backend/lib/   installDist's dependency jars + stt-backend jar
#   ui/            frontend/dist
#   tools/         whisper-cli, ffmpeg (+ its libav* libs) and the LD_LIBRARY_PATH wrapper
#   versions.json  the pinned tools and models the app reads at run time (stage.ts copies the
#                  repository's flake-rendered file; STT_MODELS_FILE overrides it in tests)
appId: app.stt.desktop
productName: Speech-to-Text
directories:
  output: dist
  buildResources: dist/stage
files:
  - build/**/*.js
  - build/**/*.cjs
  - progress.html
  - package.json
extraResources:
  - from: dist/stage/jre
    to: jre
  - from: dist/stage/backend
    to: backend
  - from: dist/stage/ui
    to: ui
  - from: dist/stage/tools
    to: tools
  - from: dist/stage/versions.json
    to: versions.json
linux:
  target:
    - target: deb
      arch: [x64]
  category: AudioVideo
  # Item 74: the .desktop entry is installed under the app's desktopName (package.json) and carries
  # StartupWMClass=app.stt.desktop - the window's WM_CLASS Electron derives from that same name -
  # so the menu entry and the running window are one app. The icon is the app's mark, the 512x512
  # PNG the MSI also uses; electron-builder generates the hicolor sizes from it.
  syncDesktopName: true
  icon: icon.png
  # /usr/bin/stt-app is a symlink into /opt/Speech-to-Text (the after-install script).
  executableName: stt-app
deb:
  priority: optional
  maintainer: Lulu Hever <lulu.berlin.2023@gmail.com>
  fpm: ['--deb-user=root', '--deb-group=root']
  # The full dependency set: electron-builder's own defaults (GTK/NSS etc., which its
  # after-install and AppArmor profile assume) plus the libraries the prebuilt
  # whisper-cli (libstdc++6, libgomp1, Vulkan loader) and ffmpeg (ALSA, Pulse, XCB,
  # udev) are linked against. Only the prebuilt Linux tools need these (ADR 0047
  # documents the same list for the Gradle bootstrap). Custom depends replace the
  # defaults, so both sets are named.
  depends:
    # The glibc floor (measured 2026-10-15): the whisper-cli prebuild and its libggml-base/
    # libggml-vulkan need GLIBC_2.38 (Electron 2.25, bytedeco ffmpeg 2.35, the jlink JRE 2.15), so
    # apt refuses the .deb on an older distribution instead of installing an app whose every
    # transcription fails with "GLIBC_2.38 not found": Ubuntu 23.10+ and Debian 13+ only.
    - libc6 (>= 2.38)
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libgbm1
    # libasound2t64 first: on Ubuntu 24.04+ `libasound2` is a *virtual* package whose only
    # provider is liboss4-salsa-asound2 (universe) — a shim whose libasound.so.2 lacks
    # snd_device_name_get_hint (ALSA >= 1.0.27), so Electron dies at startup with
    # "symbol lookup error: undefined symbol: snd_device_name_get_hint, version ALSA_0.9"
    # (seen in the packaged e2e 2026-10-14). libasound2t64 is the real library there; the
    # alternative keeps Debian 12 and Ubuntu 22.04 (real libasound2, no t64 suffix) working.
    - libasound2t64 | libasound2
    - libgomp1
    - libvulkan1
    - libstdc++6
    - libpulse0
    - libxcb1
    - libxcb-shm0
    - libudev1

mac:
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.productivity
  # Item 74: the app's mark as the app icon (a 512x512 PNG, converted to .icns), the same artwork
  # the MSI and the Linux packages carry. Naming it is explicit: without this line electron-builder
  # finds the same file by convention (`icon.png` in the project directory) and the app still gets
  # the mark - as the macOS leg measured on 2026-10-29 - but only as an accident of naming.
  icon: icon.png
  # Unsigned v1 (item 50's decision): no signing identity, no hardened runtime, no notarization.
  identity: null
  hardenedRuntime: false

# Roadmap item 49: a portable zip (unsigned), unpacked anywhere and run as a user, and the
# per-user MSI (unsigned, no elevation) that installs the same staged tree under
# %LOCALAPPDATA%\Programs. The per-user data and model directories are the app's (backend.ts,
# models.ts), not the package's, so an uninstall keeps them.
win:
  target:
    - target: zip
      arch: [x64]
    - target: msi
      arch: [x64]
  artifactName: Speech-to-Text-${version}-win-${arch}.${ext}
  # The MSI target needs an application icon: its shortcuts reference `Icon:<product>Icon.exe`,
  # but electron-builder emits the <Icon> element only when one is configured (issue #5744), so
  # without this the WiX link fails with LGHT0094. `icon.png` is the frontend's favicon.svg raster
  # at 512x512 (the app's own mark); electron-builder converts it to the exe's .ico.
  icon: icon.png
# Per-user and one-click: no admin, no wizard, `msiexec /i … /quiet` is the same install. The
# app does not start by itself after an install (`runAfterFinish: false`): silent installs are
# what the Windows job runs, and a launched app would hold the install directory.
msi:
  oneClick: true
  perMachine: false
  runAfterFinish: false
