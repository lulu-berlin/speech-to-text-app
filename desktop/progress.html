<!doctype html>
<!-- The download screen (roadmap item 50, test item 3): the window shows it while main.ts
     provisions the models, before the backend exists. Its script is src/progress.ts, compiled to
     build/progress.js (ADR 0054); preload.cts is its only channel to main. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Speech-to-Text</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      main {
        width: min(32rem, 80vw);
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 1rem;
      }
      #status {
        margin: 0 0 1.5rem;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 1rem;
      }
      ul:empty {
        display: none;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        font-size: 0.875rem;
      }
      progress {
        width: 100%;
        height: 0.5rem;
        margin-top: 0.35rem;
      }
      #error {
        margin: 1.5rem 0 0;
        color: #b3261e;
        white-space: pre-wrap;
      }
      #retry {
        margin-top: 1rem;
        padding: 0.5rem 1.25rem;
        font: inherit;
      }
      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Speech-to-Text</h1>
      <p id="status">Preparing the speech analysis models…</p>
      <ul id="files"></ul>
      <p id="error" hidden></p>
      <button id="retry" type="button" hidden>Retry</button>
    </main>
    <script src="build/progress.js"></script>
  </body>
</html>
