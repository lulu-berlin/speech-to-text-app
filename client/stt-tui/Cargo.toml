[package]
name = "stt-tui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
stt-client = { path = "../stt-client" }
# The terminal UI (roadmap item 67, decided 2026-10-22): ratatui on its crossterm backend.
ratatui = "0.30"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[dev-dependencies]
# The TUI's tests run the real binary in a pseudo-terminal (a Unix pty, a Windows ConPTY) and read
# what it draws through a terminal-screen parser (roadmap item 67, the portable-pty decision).
portable-pty = "0.9"
tempfile = "3"
vt100 = "0.18"

[target.'cfg(unix)'.dev-dependencies]
# Reads the pty's termios flags: whether the TUI left the terminal cooked.
libc = "0.2"
