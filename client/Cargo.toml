# The Rust client workspace (roadmap items 66 and 67): the crates that talk to the per-user service
# from outside the JVM — the client library `stt-client`, shared by the tray (`stt-tray`), the CLI
# (`stt-app`) and item 67's TUI.
[workspace]
resolver = "3"
members = ["stt-app", "stt-client", "stt-tray", "stt-tui"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
publish = false
