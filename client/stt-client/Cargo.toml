[package]
name = "stt-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Plain HTTP only: the service listens on loopback, so no TLS stack and no gzip (roadmap item 66).
ureq = { version = "3", default-features = false }
# Splits the user's `terminalCommand` setting the way a POSIX shell splits a command line.
shlex = "2"

[dev-dependencies]
tempfile = "3"
