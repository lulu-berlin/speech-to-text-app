[package]
name = "stt-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Async HTTP on tokio (roadmap item 67, decided 2026-10-22). Plain HTTP only: the service listens on
# loopback, so no TLS stack, no HTTP/2 and no compression - none of reqwest's default features.
reqwest = { version = "0.13", default-features = false }
tokio = { version = "1", features = ["time"] }
# Splits the user's `terminalCommand` setting the way a POSIX shell splits a command line.
shlex = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
