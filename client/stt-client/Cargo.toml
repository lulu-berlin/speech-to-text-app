[package]
name = "stt-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Async HTTP on tokio (roadmap item 67, decided 2026-10-22). Plain HTTP only: the service listens on
# loopback, so no TLS stack, no HTTP/2 and no compression - none of reqwest's default features.
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "stream"] }
tokio = { version = "1", features = ["fs", "io-util", "time"] }
# Streams an upload from the file on disk, so a large recording is never held in memory whole.
tokio-util = { version = "0.7", features = ["io"] }
# Splits the user's `terminalCommand` setting the way a POSIX shell splits a command line.
shlex = "2"
# The app's language (roadmap item 88): ICU4X writes the dates, numbers and plural categories of
# the locale the browser's `Intl` uses, from data compiled into the binary.
icu = { version = "2", features = ["compiled_data"] }
# The finish dates the TUI shows, from the API's UTC milliseconds.
chrono = "0.4"
# The system's language on Windows and macOS, where no POSIX locale variable names it.
sys-locale = "0.3"
# A text's direction is its first letter's (roadmap item 76): `\p{L}`, Unicode's letter categories,
# as the browser's rule matches them.
regex = "1"

[build-dependencies]
# Reads `frontend/src/locales/<locale>.json` and `docs/api/ui-locales.json` into the constants the
# crate compiles in (ADR 0067).
serde_json = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
